<svg xmlns="http://www.w3.org/2000/svg" width="760" height="240" viewBox="0 0 760 240" role="img" aria-labelledby="title description">
  <title id="title">Sequential job chaining</title>
  <desc id="description">Function 1 writes to a database, then Function 2 writes to another database before Function 3 runs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#475569"/>
    </marker>
  </defs>
  <g fill="none" stroke="#475569" stroke-linecap="round" stroke-width="4" marker-end="url(#arrow)">
    <path d="M145 120h15"/>
    <path d="M280 120h15"/>
    <path d="M425 120h15"/>
    <path d="M560 120h15"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <g fill="#eef2ff" stroke="#4f46e5" stroke-width="3">
      <rect x="15" y="70" width="130" height="100" rx="8"/>
      <rect x="295" y="70" width="130" height="100" rx="8"/>
      <rect x="575" y="70" width="130" height="100" rx="8"/>
    </g>
    <g fill="#1e293b" font-size="24" font-weight="600">
      <text x="80" y="112"><tspan x="80">Function</tspan><tspan x="80" dy="30">1</tspan></text>
      <text x="360" y="112"><tspan x="360">Function</tspan><tspan x="360" dy="30">2</tspan></text>
      <text x="640" y="112"><tspan x="640">Function</tspan><tspan x="640" dy="30">3</tspan></text>
    </g>
    <g fill="#ecfeff" stroke="#0891b2" stroke-width="3">
      <path d="M160 92c0-13 27-22 60-22s60 9 60 22v56c0 13-27 22-60 22s-60-9-60-22z"/>
      <ellipse cx="220" cy="92" rx="60" ry="22" fill="#cffafe"/>
      <path d="M440 92c0-13 27-22 60-22s60 9 60 22v56c0 13-27 22-60 22s-60-9-60-22z"/>
      <ellipse cx="500" cy="92" rx="60" ry="22" fill="#cffafe"/>
    </g>
    <g fill="#1e293b" font-size="22" font-weight="600">
      <text x="220" y="130">Database</text>
      <text x="500" y="130">Database</text>
    </g>
  </g>
</svg>
