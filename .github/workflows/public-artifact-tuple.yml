name: Public Artifact Tuple

on:
  workflow_dispatch:
    inputs:
      tuple_date:
        description: Version-history date in YYYY-MM-DD format. Defaults to the UTC run date.
        required: false
        type: string
  schedule:
    - cron: '37 6 * * *'

permissions:
  contents: read

concurrency:
  group: public-artifact-tuple
  cancel-in-progress: false

jobs:
  refresh:
    name: Prepare release-audit tuple handoff
    if: >-
      github.repository == 'durable-workflow/durable-workflow.github.io' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify live Python package release authority
        run: node scripts/check-python-package-release.js --live

      - name: Resolve tuple date
        id: tuple-date
        env:
          INPUT_TUPLE_DATE: ${{ inputs.tuple_date }}
        run: |
          set -euo pipefail

          tuple_date="${INPUT_TUPLE_DATE:-}"
          if [ -z "$tuple_date" ]; then
            tuple_date="$(date -u +%F)"
          fi

          case "$tuple_date" in
            [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
            *) echo "tuple_date must use YYYY-MM-DD format: $tuple_date" >&2; exit 1 ;;
          esac

          echo "value=$tuple_date" >> "$GITHUB_OUTPUT"

      - name: Refresh public artifact tuple
        run: node scripts/refresh-public-artifact-versions.js --date "${{ steps.tuple-date.outputs.value }}"

      - name: Refresh current Waterline release qualification
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          node scripts/refresh-waterline-release-qualification.js
          --attempts 13
          --retry-ms 10000

      - name: Detect tuple changes
        id: changes
        run: |
          set -euo pipefail

          if git diff --quiet -- scripts/public-artifact-versions.json scripts/published-artifact-versions.json scripts/platform-conformance-retained-evidence.json scripts/component-release-qualification-retained-evidence.json static/platform-conformance/run-ledger.json static/public-artifact-compatibility-evidence.json static/public-component-release-qualifications.json static/quickstart-execution-contract.json static/compatibility-contract.json static/sdk-neutrality-contract.json scripts/workflow-sdk-neutrality-authority-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff -- scripts/public-artifact-versions.json scripts/published-artifact-versions.json scripts/platform-conformance-retained-evidence.json scripts/component-release-qualification-retained-evidence.json static/platform-conformance/run-ledger.json static/public-artifact-compatibility-evidence.json static/public-component-release-qualifications.json static/quickstart-execution-contract.json static/compatibility-contract.json static/sdk-neutrality-contract.json scripts/workflow-sdk-neutrality-authority-lock.json
          fi

      - name: Resolve published Server protocol authority ref
        id: published-server-authority
        if: steps.changes.outputs.changed == 'true'
        run: |
          node -e "process.stdout.write('ref=' + require('./scripts/published-artifact-versions.json').artifacts.server + '\n')" >> "$GITHUB_OUTPUT"

      - name: Checkout published Server protocol authority
        if: steps.changes.outputs.changed == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          repository: ${{ github.repository_owner }}/server
          ref: ${{ steps.published-server-authority.outputs.ref }}
          path: .published-server-protocol-authority
          persist-credentials: false

      - name: Verify candidate server protocol catalog
        if: steps.changes.outputs.changed == 'true'
        env:
          PUBLIC_SERVER_PROTOCOL_CATALOG_EVIDENCE: public-server-protocol-catalog-conformance.json
          PUBLIC_SERVER_SOURCE_PATH: ${{ github.workspace }}/.published-server-protocol-authority
        run: node scripts/check-public-server-protocol-catalog.js

      - name: Upload candidate server protocol catalog evidence
        if: ${{ always() && steps.changes.outputs.changed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: public-server-protocol-catalog-conformance
          path: |
            public-server-protocol-catalog-conformance.json
            public-server-protocol-catalog-bootstrap.log
            public-server-protocol-catalog-server.log
          if-no-files-found: error

      - name: Resolve Workflow authority ref
        id: workflow-authority
        if: steps.changes.outputs.changed == 'true'
        run: |
          node -e "process.stdout.write('ref=' + require('./scripts/workflow-sdk-neutrality-authority-lock.json').workflow_source_commit + '\n')" >> "$GITHUB_OUTPUT"

      - name: Checkout Workflow authority
        if: steps.changes.outputs.changed == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          repository: durable-workflow/workflow
          ref: ${{ steps.workflow-authority.outputs.ref }}
          path: .workflow-authority
          persist-credentials: false

      - name: Write pipeline handoff
        if: steps.changes.outputs.changed == 'true'
        env:
          TUPLE_DATE: ${{ steps.tuple-date.outputs.value }}
        run: |
          node <<'NODE'
          const childProcess = require('child_process');
          const fs = require('fs');
          const {
            buildPublishedServerProtocolAuthority,
          } = require('./scripts/check-public-server-protocol-catalog');
          const {
            buildSdkNeutralityAuthorityIdentity,
          } = require('./scripts/route-public-artifact-tuple-handoff');
          const {
            currentQualificationSummary,
          } = require('./scripts/generate-component-release-qualifications');
          const source = require('./scripts/public-artifact-versions.json');
          const publishedSource = require('./scripts/published-artifact-versions.json');
          const compatibilityEvidence =
            require('./static/public-artifact-compatibility-evidence.json');
          const componentQualificationSource =
            require('./scripts/component-release-qualification-retained-evidence.json');
          const componentReleaseQualification =
            currentQualificationSummary(componentQualificationSource);
          const sdkNeutralityContractSource = fs.readFileSync(
            'static/sdk-neutrality-contract.json',
            'utf8',
          );
          const sdkNeutralityAuthorityLockSource = fs.readFileSync(
            'scripts/workflow-sdk-neutrality-authority-lock.json',
            'utf8',
          );
          const sdkNeutralityWorkflowResourceSource = fs.readFileSync(
            '.workflow-authority/resources/sdk-neutrality-contract.json',
            'utf8',
          );
          const sdkNeutralityAuthority = buildSdkNeutralityAuthorityIdentity(
            publishedSource.artifacts.workflow,
            sdkNeutralityContractSource,
            sdkNeutralityAuthorityLockSource,
            publishedSource.artifacts,
            sdkNeutralityWorkflowResourceSource,
          );
          const previousPublishedSource = JSON.parse(childProcess.execFileSync(
            'git',
            ['show', 'HEAD:scripts/published-artifact-versions.json'],
            {encoding: 'utf8'}
          ));
          const serverProtocolAuthority = buildPublishedServerProtocolAuthority(
            JSON.parse(fs.readFileSync(
              'public-server-protocol-catalog-conformance.json',
              'utf8',
            )),
            publishedSource.artifacts.server,
            require('./static/platform-protocol-specs.json'),
          );

          const refreshCommand = 'npm run refresh:public-artifact-versions';
          const refreshFiles = [
            'scripts/public-artifact-versions.json',
            'scripts/published-artifact-versions.json',
            'scripts/platform-conformance-retained-evidence.json',
            'scripts/component-release-qualification-retained-evidence.json',
            'static/platform-conformance/run-ledger.json',
            'static/public-artifact-compatibility-evidence.json',
            'static/public-component-release-qualifications.json',
            'static/quickstart-execution-contract.json',
            'static/compatibility-contract.json',
            'static/sdk-neutrality-contract.json',
            'scripts/workflow-sdk-neutrality-authority-lock.json',
          ];
          const allChangedFiles = childProcess.execFileSync(
            'git',
            ['diff', '--name-only'],
            {encoding: 'utf8'}
          ).trim().split('\n').filter(Boolean);
          const unexpected = allChangedFiles.filter(file => !refreshFiles.includes(file));
          const changedFiles = allChangedFiles.filter(file => refreshFiles.includes(file));

          if (unexpected.length > 0) {
            throw new Error(`Public artifact tuple handoff may only change ${refreshFiles.join(', ')}; saw ${unexpected.join(', ')}`);
          }

          const serverUrl = process.env.GITHUB_SERVER_URL || 'https://github.com';
          const repository = process.env.GITHUB_REPOSITORY || null;
          const runId = process.env.GITHUB_RUN_ID || null;
          const handoff = {
            schema: 'durable-workflow.docs.public-artifact-tuple-handoff',
            schema_version: 5,
            action: 'pipeline_ready_item',
            reason: 'public_artifact_tuple_refresh_available',
            repository: 'durable-workflow.github.io',
            target_branch: 'main',
            integration: 'pipeline',
            refresh_command: refreshCommand,
            refresh_files: refreshFiles,
            changed_files: changedFiles,
            tuple_date: process.env.TUPLE_DATE,
            artifact_versions: source.artifacts,
            published_artifact_versions: publishedSource.artifacts,
            compatibility_evidence: compatibilityEvidence,
            current_component_release_qualification: componentReleaseQualification,
            published_server_protocol_authority: serverProtocolAuthority,
            sdk_neutrality_authority: sdkNeutralityAuthority,
            previous_published_artifact_versions: previousPublishedSource.artifacts,
            source_check: {
              repository,
              ref: process.env.GITHUB_REF_NAME || null,
              sha: process.env.GITHUB_SHA || null,
              run_id: runId,
              run_attempt: process.env.GITHUB_RUN_ATTEMPT || null,
              run_url: repository && runId
                ? `${serverUrl}/${repository}/actions/runs/${runId}`
                : null,
            },
            release_status_guard: {
              stable_default_docs_line: '1.x',
              prerelease_docs_line: '2.0',
              no_default_docs_cutover: true,
              live_release_audit_assertions: [
                'LEAK=0',
                'MIXED=0',
                'stable default 1.x',
                'explicit prerelease 2.0',
              ],
            },
            ready_item: {
              title: 'Refresh public docs artifact tuple',
              body: [
                'Published package registries now contain newer independently published components than the docs release-audit surface.',
                '',
                `Run ${refreshCommand} and commit only the generated published-component and qualified aggregate files through the normal docs merge path.`,
              ].join('\n'),
              labels: [
                'pipeline:ready-item',
                'branch:main',
                'state:pending',
                'source:handoff',
                'flow:release',
              ],
              acceptance: [
                'The published-component source reports the newest independently published releases.',
                'The qualified aggregate remains the exact compatibility-backed recommendation.',
                'Every SDK in the qualified aggregate is bound to its qualified Server by exact passing compatibility evidence.',
                'Stable 1.x remains the default public docs line.',
                'The live release-audit JSON reports LEAK=0 and MIXED=0.',
                'The refresh lands through the docs merge gate, not from a public release workflow.',
              ],
            },
          };

          fs.writeFileSync('docs-artifact-tuple-handoff.json', `${JSON.stringify(handoff, null, 2)}\n`);
          NODE

      - name: Upload pipeline handoff
        id: handoff-artifact
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: public-artifact-tuple-pipeline-handoff
          path: docs-artifact-tuple-handoff.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false

      - name: Route or defer pipeline handoff
        id: handoff-routing
        if: steps.changes.outputs.changed == 'true'
        env:
          PUBLIC_ARTIFACT_TUPLE_CALLBACK_URL: ${{ secrets.PUBLIC_ARTIFACT_TUPLE_CALLBACK_URL }}
          PUBLIC_ARTIFACT_TUPLE_CALLBACK_KEY_ID: ${{ secrets.PUBLIC_ARTIFACT_TUPLE_CALLBACK_KEY_ID }}
          PUBLIC_ARTIFACT_TUPLE_CALLBACK_HMAC_KEY: ${{ secrets.PUBLIC_ARTIFACT_TUPLE_CALLBACK_HMAC_KEY }}
          HANDOFF_ARTIFACT_ID: ${{ steps.handoff-artifact.outputs.artifact-id }}
          HANDOFF_ARTIFACT_SHA256: ${{ steps.handoff-artifact.outputs.artifact-digest }}
        run: node scripts/route-public-artifact-tuple-handoff.js --handoff docs-artifact-tuple-handoff.json

      - name: Resolve published Workflow conformance ref
        id: published-workflow
        if: steps.changes.outputs.changed == 'true'
        run: |
          node -e "process.stdout.write('ref=' + require('./scripts/published-artifact-versions.json').artifacts.workflow + '\n')" >> "$GITHUB_OUTPUT"

      - name: Checkout published Workflow conformance authority
        if: steps.changes.outputs.changed == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          repository: ${{ github.repository_owner }}/workflow
          ref: ${{ steps.published-workflow.outputs.ref }}
          path: .published-workflow-authority
          persist-credentials: false

      - name: Validate refreshed docs
        if: steps.changes.outputs.changed == 'true'
        env:
          WORKFLOW_SDK_NEUTRALITY_MANIFEST_PATH: ${{ github.workspace }}/.workflow-authority/resources/sdk-neutrality-contract.json
          WORKFLOW_PLATFORM_CONFORMANCE_MANIFEST_PATH: ${{ github.workspace }}/.published-workflow-authority/resources/platform-conformance-contract.json
        run: npm run build

      - name: Report current tuple
        if: steps.changes.outputs.changed == 'false'
        run: node scripts/refresh-public-artifact-versions.js --check
