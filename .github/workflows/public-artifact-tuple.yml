name: Public Artifact Tuple

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - public-artifact-released
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: public-artifact-tuple-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh and deploy docs audit
    runs-on: ubuntu-latest
    if: github.repository == 'durable-workflow/durable-workflow.github.io'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh published artifact tuple sources
        id: tuple
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          npm run refresh:public-artifact-versions

          if git diff --quiet -- scripts/public-artifact-versions.json docs/compatibility.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Public artifact tuple sources are current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff -- scripts/public-artifact-versions.json docs/compatibility.md
          fi

      - name: Build website from refreshed tuple
        if: steps.tuple.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build

      - name: Commit refreshed tuple sources
        if: steps.tuple.outputs.changed == 'true'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/public-artifact-versions.json docs/compatibility.md
          git commit -m "Refresh public artifact tuple"
          git push origin HEAD:main

      - name: Deploy refreshed public docs audit
        if: steps.tuple.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
