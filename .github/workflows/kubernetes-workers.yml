name: Kubernetes SDK worker guide

on:
  pull_request:
    paths:
      - docs/deployment.md
      - tests/kubernetes-workers/**
      - .github/workflows/kubernetes-workers.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kubernetes-worker-guide-${{ github.ref }}
  cancel-in-progress: true

jobs:
  published-workers:
    name: Published SDK workers on Kubernetes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - name: Install verified kind and kubectl binaries
        shell: bash
        run: |
          install_dir="${RUNNER_TEMP}/worker-guide-tools"
          mkdir -p "$install_dir"
          curl --proto '=https' --proto-redir '=https' -fsSLo "$install_dir/kind" https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64
          curl --proto '=https' --proto-redir '=https' -fsSLo "$install_dir/kind.sha256" https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64.sha256sum
          expected="$(cut -d ' ' -f 1 "$install_dir/kind.sha256")"
          printf '%s  %s\n' "$expected" "$install_dir/kind" | sha256sum --check
          curl --proto '=https' --proto-redir '=https' -fsSLo "$install_dir/kubectl" https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl
          curl --proto '=https' --proto-redir '=https' -fsSLo "$install_dir/kubectl.sha256" https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl.sha256
          expected="$(cat "$install_dir/kubectl.sha256")"
          printf '%s  %s\n' "$expected" "$install_dir/kubectl" | sha256sum --check
          chmod +x "$install_dir/kind" "$install_dir/kubectl"
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Exercise the documented Deployment with published artifacts
        env:
          QUALIFICATION_OUTPUT: ${{ runner.temp }}/worker-guide-evidence
        run: python3 tests/kubernetes-workers/qualify.py
      - name: Retain bounded qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: kubernetes-worker-guide-evidence
          path: ${{ runner.temp }}/worker-guide-evidence
          retention-days: 3
          if-no-files-found: ignore
