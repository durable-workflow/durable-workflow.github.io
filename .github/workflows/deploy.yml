name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. A newer push waits for the deployment in progress
# instead of cancelling it part-way.
concurrency:
  group: public-docs-deploy
  cancel-in-progress: false

jobs:
  # Runs dependency and build code with a read-only token. It can only
  # produce the Pages artifact.
  build:
    name: Build website
    if: >-
      github.repository == 'durable-workflow/durable-workflow.github.io' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Apply reviewed dependency patches
        run: npx --no-install patch-package
      - name: Validate analytics configuration
        env:
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: |
          if ! printf '%s' "$CLOUDFLARE_WEB_ANALYTICS_TOKEN" | grep -Eq '^[a-f0-9]{32}$'; then
            echo 'CLOUDFLARE_WEB_ANALYTICS_TOKEN must be the canonical 32-character site token' >&2
            exit 1
          fi
      - name: Build website
        env:
          DOCS_TRANSLATION_BASE: ${{ github.event.before }}
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: build

  # Holds the Pages deployment credentials and runs no repository or
  # dependency code: it only publishes the artifact built above.
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: >-
      github.repository == 'durable-workflow/durable-workflow.github.io' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Requires Settings > Pages > Source = "GitHub Actions". With the old
      # gh-pages branch source, stop here: the site keeps serving its last
      # deployment.
      - name: Require the GitHub Actions Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)"
          if [ "$build_type" != workflow ]; then
            echo "::error::Pages source is '$build_type'. Set Settings > Pages > Source to GitHub Actions, then re-run this workflow."
            exit 1
          fi
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5
